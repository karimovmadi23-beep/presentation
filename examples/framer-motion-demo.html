<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framer Motion — проверка fade-in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#f3f0ea;color:#1c1a16;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .card{padding:48px 56px;border-radius:24px;background:#faf8f4;
        box-shadow:0 30px 60px -30px rgba(30,26,18,.4);text-align:center;
        opacity:0}            /* стартовое состояние — анимацию задаёт Framer Motion */
  h1{margin:0 0 10px;font-size:30px;letter-spacing:-.02em}
  p{margin:0;color:#6f6a60;font-size:14px}
</style>
</head>
<body>

<!-- Пакет не собран для браузера и обращается к process.env.NODE_ENV.
     В реальном проекте это делает сборщик (Vite/Next); здесь — минимальный шим. -->
<script>window.process = { env: { NODE_ENV: 'production' } };</script>

<!-- Bare-импорты внутри framer-motion/dom резолвятся через import map -->
<script type="importmap">
{
  "imports": {
    "motion-dom":   "../node_modules/motion-dom/dist/es/index.mjs",
    "motion-utils": "../node_modules/motion-utils/dist/es/index.mjs"
  }
}
</script>

<div class="card" id="card">
  <h1>Framer Motion работает</h1>
  <p>fade-in + подъём, vanilla API без React</p>
</div>

<script type="module">
  import { animate } from '../node_modules/framer-motion/dist/es/dom.mjs';

  animate(
    '#card',
    { opacity: [0, 1], y: [24, 0] },
    { duration: 0.8, ease: [0.22, 0.61, 0.36, 1] }
  );
</script>

</body>
</html>
